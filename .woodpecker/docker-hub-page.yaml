# Docker Hub's page for mh3rs/server: the operator's guide, deploy/README.md, on main when it changes. Docker Hub's
# API, as peter-evans/dockerhub-description calls it; the token needs the Read, Write, Delete scope to edit a page.
when:
  - event: push
    branch: main
    path: deploy/README.md
  - event: manual
    branch: main

# The image's first push creates the repository: when the image runs too, wait for it.
depends_on:
  - push
  - name: image
    optional: true

steps:
  - name: page
    image: alpine:3.22
    environment:
      HUB_USER:
        from_secret: docker_hub_user
      HUB_TOKEN:
        from_secret: docker_hub_token
    commands:
      - apk add --no-cache curl jq >/dev/null
      # `$$` is a `$` for the shell: Woodpecker substitutes the others.
      # The sign-in through a pipe, never a file in the workspace; pipefail, so a refused sign-in stops here.
      - set -o pipefail
      - >-
        access=$$(jq -n --arg u "$$HUB_USER" --arg s "$$HUB_TOKEN" '{identifier:$$u,secret:$$s}'
        | curl -fsS -H "Content-Type: application/json" -d @- https://hub.docker.com/v2/auth/token
        | jq -er .access_token)
      - jq -Rs '{description:"Monster Hunter Tri online server (Wii), in Rust", full_description:.}' deploy/README.md > page.json
      - >-
        curl -fsS -o /dev/null -X PATCH -H "Content-Type: application/json" -H "Authorization: Bearer $$access"
        -d @page.json https://hub.docker.com/v2/repositories/mh3rs/server/
