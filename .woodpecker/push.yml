when:
  - event: [push, pull_request, manual]

steps:
  - name: check
    image: rust:1.98.0-bookworm
    environment:
      # Separate from the developer's target/ when the local runner mounts the working tree.
      CARGO_TARGET_DIR: target/ci
    commands:
      # The dependency audit's tool, pinned (scripts run `cargo deny check`).
      - curl -sSfL https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-$$(uname -m)-unknown-linux-musl.tar.gz | tar xz --strip-components=1 -C /usr/local/cargo/bin --wildcards '*/cargo-deny'
      - scripts/ci-tests.sh
