# Release candidates: on dev, once the checks passed, an image tagged with the version the next release will have
# (git-cliff, as scripts/release.sh computes it) plus -rc: rc, 1-rc, 1.2-rc, 1.2.3-rc, in Gitea's registry only (the
# public image comes from a release). The app inside still reports the last release's version: the manifest is bumped
# by the release itself.
when:
  - event: push
    branch: dev
    path:
      exclude: ["**/*.md", ".claude/**", "LICENSE", ".gitignore", "cliff.toml"]
    # Not the version commit coming back into dev: that is a release, not a candidate.
    evaluate: 'not (trim(CI_COMMIT_MESSAGE) matches "^[0-9]+[.][0-9]+[.][0-9]+$")'
  - event: manual
    branch: dev
depends_on: [ci]
# git-cliff needs the history since the last release, and its tag.
clone:
  git:
    # The version the server trusts with clone credentials (WOODPECKER_PLUGINS_TRUSTED_CLONE's default in 3.20).
    image: woodpeckerci/plugin-git:2.11.0
    settings:
      tags: true
steps:
  - name: tags
    image: ghcr.io/orhun/git-cliff/git-cliff:2.14.2
    commands:
      - v=$(git-cliff --bumped-version)
      - test -n "$v"
      - printf '%s\n' rc "$${v%%.*}-rc" "$${v%.*}-rc" "$v-rc" > .tags
      - cat .tags
  # The only privileged plugin the server trusts (WOODPECKER_PLUGINS_PRIVILEGED): keep this exact version.
  - name: image
    image: woodpeckerci/plugin-docker-buildx:5.0.0
    depends_on: [tags]
    settings:
      registry: git.pband.ch
      repo: git.pband.ch/${CI_REPO}
      # arm64 only for an image the public pulls (release.yaml): emulated, it multiplies the build time (a Rust release:
      # 28 minutes).
      platforms: linux/amd64
      dockerfile: Dockerfile
      tags_file: .tags
      username:
        from_secret: gitea_user
      password:
        from_secret: gitea_token
