# mh3sp server configuration. scripts/dev.sh copies this file to config.toml (gitignored).
# DATABASE_URL and VALKEY_URL environment variables override the URLs below.

[listen]
# Remove a role's line to disable it on this node.
opn = "0.0.0.0:8200"
lmp = "0.0.0.0:8201"
fmp = "0.0.0.0:8202"
# HTTP: /health/live (process works) and /health/ready (Postgres and Valkey reachable).
health = "0.0.0.0:8280"

[tls]
# Signed by the CA that the patched game trusts (MH3SP's dev CA, certs/dev/ca.der).
cert = "certs/dev/server.crt"
key = "certs/dev/server.key"

[database]
url = "postgres://mh3sp:mh3sp@localhost:55432/mh3sp"

[valkey]
url = "redis://localhost:56379"
