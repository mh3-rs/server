# mh3sp for an operator (README.md, "Running it"): the server, its data, the content, the secret.
# Next to this file: mh3sp.toml (from mh3sp.toml.example), secret (openssl rand -hex 32), content/ (MH3SP's
# event-quest-rotation-full checkout), data/ (owned by uid 999, the image's user: `mkdir data && sudo chown 999 data`;
# the server creates its CA in data/tls at the first start).
services:
  mh3sp:
    # main's image, from the private Gitea registry until the release on Docker Hub (`docker login git.pband.ch`).
    image: git.pband.ch/experiment/mh3sp-rs:main
    # NAT negotiation needs the consoles' real addresses: no published ports, no Docker Desktop, no rootless.
    network_mode: host
    restart: unless-stopped
    secrets: [mh3sp]
    volumes:
      # The working directory's mh3sp.toml is the server's configuration (and `mh3sp healthcheck`'s).
      - ./mh3sp.toml:/opt/mh3sp/mh3sp.toml:ro
      - ./data:/opt/mh3sp/data
      - ./content:/opt/mh3sp/content:ro

secrets:
  mh3sp:
    file: ./secret
