# `cargo deny check` (scripts/ci-tests.sh): known vulnerabilities, licenses compatible with AGPL-3.0, sources.
[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
# Permissive licenses the dependencies use today, all compatible with AGPL-3.0-or-later. A new one is a decision.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib", "BSD-3-Clause"]
# Ours, from our registry (.cargo/config.toml): AGPL, as this one.
exceptions = [{ crate = "shared", allow = ["AGPL-3.0-or-later"] }, { crate = "tunnel", allow = ["AGPL-3.0-or-later"] }]

[licenses.private]
# Our own crates (`publish = false`).
ignore = true

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Our crates (shared, tunnel), from their GitHub mirrors.
[sources.allow-org]
github = ["mh3-rs"]
