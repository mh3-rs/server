# Where the Rust server differs from the recordings on purpose. Same format as masks.toml (the bytes are ignored
# when comparing), plus a required `reason`. Each entry goes away when its reason does.

# World server populations (field 0x08, a long, of each record in the LMP and FMP lists). The Rust server has no
# populations before the world (M2). MH3SP also counts ghosts: its LMP handler joins the servers the console only
# asks the address of (`ReqFmpInfo` for 11 and 12), leaving one player on Greed4 in every recording; and dev1 on
# Valor1 in s04 is real. To narrow to the ghosts once populations exist.
[[mask]]
packet = "AnsFmpListData"
pattern = "0803"
offset = 2
len = 4
reason = "world server populations (M2 world; MH3SP's ghost on Greed4)"

[[mask]]
packet = "AnsFmpListData2"
pattern = "0803"
offset = 2
len = 4
reason = "world server populations (M2 world; MH3SP's ghost on Greed4)"

# Content binaries: their version is derived from their bytes (M2 D2), MH3SP numbers them (1, the event slot, …).
[[mask]]
packet = "AnsBinaryVersion"
offset = 1
len = 4
reason = "content versions derive from the bytes (M2 D2)"

[[mask]]
packet = "AnsBinaryHead"
offset = 0
len = 4
reason = "content versions derive from the bytes (M2 D2)"

[[mask]]
packet = "AnsBinaryData"
offset = 0
len = 4
reason = "content versions derive from the bytes (M2 D2)"

# The black list: MH3SP answers one blank entry (shown by consoles as an empty line they can't delete), the Rust
# server the actual list (empty until M3). The payload is an unknown u32, then the record count and the records:
# compared up to the count.
[[mask]]
packet = "AnsBlackList"
offset = 4
reason = "no blank placeholder entry in the black list (seen on consoles: an empty line)"

# The city's seats (M5): the real ones taken (none in the recordings), not MH3SP's 14 free placeholder entries named
# "Test". Compared from the list's count on (the mode byte before it is the same).
[[mask]]
packet = "AnsLayerMediationList"
offset = 1
reason = "the city's seats actually taken, not MH3SP's 14 free placeholders"

# Player Search leaves out the searcher (M5 D9): MH3SP's answers to s12's 'dev' and 'de' list both hunters, ours only
# dev2. Ignored: the count in every head (all 8 bytes long), and the rows of those two-row answers (626 bytes); the
# search by Capcom ID (one row) is still compared whole.
[[mask]]
packet = "AnsUserSearchHead"
offset = 4
len = 4
reason = "Player Search leaves out the searcher (M5 D9)"

[[mask]]
packet = "AnsUserSearchData"
payload_len = 626
offset = 4
reason = "Player Search leaves out the searcher (M5 D9)"

# Paths a console jumps to start with its version constant (M5 D11: 4 on PAL), MH3SP's with the depth: a card's item 4
# (the path after its marker: item 4, binary, 14 bytes).
[[mask]]
packet = "AnsUserSearchInfo"
pattern = "0406000e"
offset = 4
len = 4
reason = "jump paths start with the console's version constant (M5 D11)"

# Change Gates' rows carry the path a pick jumps to (item 2, M5 D11); MH3SP's have none (picking one failed): compared
# up to the rows (`jumps_within_a_world_server` checks them).
[[mask]]
packet = "AnsLayerSiblingListData"
offset = 8
reason = "Change Gates' rows carry the path a pick jumps to (M5 D11)"

# A quest's password (field 0x04 of a quest record, a string): MH3SP sends it in clear to everyone in the city, the
# Rust server a placeholder (s10's password and the placeholder are both 4 characters).
[[mask]]
packet = "NtcCircleListLayerChange"
pattern = "04050004"
offset = 4
len = 4
reason = "a quest's password never leaves the server (M3 D9): a placeholder where MH3SP sent it in clear"

[[mask]]
packet = "AnsCircleInfo"
pattern = "04050004"
offset = 4
len = 4
reason = "a quest's password never leaves the server (M3 D9): a placeholder where MH3SP sent it in clear"

[[mask]]
packet = "AnsCircleListLayer"
pattern = "04050004"
offset = 4
len = 4
reason = "a quest's password never leaves the server (M3 D9): a placeholder where MH3SP sent it in clear"

[[mask]]
packet = "NtcCircleInfoSet"
pattern = "04050004"
offset = 4
len = 4
reason = "a quest's password never leaves the server (M3 D9): a placeholder where MH3SP sent it in clear"

# A layer's record (LayerChildInfo: the game's Local Info screen): MH3SP answers a placeholder layer named
# "LayerStart" with 0 of 4 players every time (seen on a console: "population 0/4" with two players in the city);
# the Rust server answers the real gate or city record.
[[mask]]
packet = "AnsLayerChildInfo"
offset = 0
reason = "the console's own number echoed (MH3SP: always 1, so the console ignored the record), the real layer record and the city's settings, not MH3SP's placeholder (Local Info showed 0/4)"

# Frames the Rust server doesn't send, on purpose: [[omit]] names the scenario, the connection, the packet and its
# sequence number, with a reason; `alert = true`: an answer it replaces with an alert (a refusal).

# dev2's second tell ('test') after dev1 blocked them: MH3SP delivered it; the Rust server doesn't deliver to a
# blocker what their blocked hunters send them (M3 D2).
[[omit]]
scenario = "s09-blacklist"
connection = "dev1-05-fmp"
packet = "NtcTell"
seq = 2810
reason = "blocked hunters' tells aren't delivered (M3 D2)"

# s10: dev2 ends its session half a minute after its party was cancelled; MH3SP still had it in the quest (it doesn't
# clear members' quest when a party breaks) and "leaves" it again on the way out: a list change about a quest that
# no longer exists.
[[omit]]
scenario = "s10-party"
connection = "dev2-05-fmp"
packet = "NtcCircleListLayerChange"
seq = 0
reason = "MH3SP's stale quest after a party breaks (a member leaving it again later)"

# s15: dev1 sends dev2 a friend request from dev2's card while dev2, just in the city it created, hasn't moved yet.
# MH3SP pushes it at once; the Rust server delivers it at dev2's next position in the city (M3 D2: the game drops a
# message arriving while a scene loads), so it arrives later, as an extra notice.
[[omit]]
scenario = "s15-jumps"
connection = "dev2-05-fmp"
packet = "NtcFriendAccept"
seq = 30275
reason = "friend requests are delivered at the recipient's next position in a city (M3 D2)"

# s13: dev2 sits on dev1's seat while dev1 is on it; MH3SP says yes, the Rust server refuses with an alert (one
# player per seat, M5).
[[omit]]
scenario = "s13-seats"
connection = "dev2-05-fmp"
packet = "AnsLayerMediationLock"
seq = 5095
alert = true
reason = "one player per seat: a taken seat is refused with an alert (M5)"

# s14: dev1 messages dev2 (from the friends list) while dev2 stands in a gate; MH3SP delivers it at once, the Rust
# server once dev2 stands in a city (M3 D2), which it never does again.
[[omit]]
scenario = "s14-layer-tell"
connection = "dev2-05-fmp"
packet = "NtcTell"
seq = 18888
reason = "messages are delivered when the recipient stands in a city (M3 D2)"
