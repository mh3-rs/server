  "dev2: Online, slot 1, Valor1, gate 1, join dev1's city",
  "dev1: message to dev2 with a friend request ('friends?')",
  "dev2: leave it in the inbox, accept it from the inbox a minute later",
  "both: friend list shows the other; dev1 deletes dev2",
  "both: return to title",
]
consoles = 2
