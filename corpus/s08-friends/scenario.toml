description = "Friends: dev1 creates a city, dev2 joins; dev1 sends dev2 a message with a friend request ('friends?'); dev2 leaves it in the game's message inbox, accepts it from there about a minute later; both see the other in their friend list; dev1 deletes dev2. A friend request travels as a message (NtcFriendAccept) kept in the recipient's inbox; the friend list is only asked for when entering a world server, and the protocol has no notification of a deletion, so dev2's list keeps dev1 until its next login."
steps = [
