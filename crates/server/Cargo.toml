[package]
name = "server"
description = "The mh3sp server: every role (OPN, LMP, FMP) in one binary."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "mh3sp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
bytes = "1.12.1"
dashmap = "6.2.1"
dotenvy = "0.15.7"
futures-util = "0.3.34"
hex = "0.4.3"
moka = { version = "0.12.16", features = ["sync"] }
openssl = "0.10.81"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "signal"] }
tokio-openssl = "0.6.5"
tokio-util = { version = "0.7.19", features = ["codec", "rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.27.0", features = ["v7"] }
wire = { path = "../wire" }

[dev-dependencies]
tempfile = "3.27.0"
