[package]
name = "server"
description = "The mh3sp server: every role (OPN, LMP, FMP) in one binary."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "mh3sp"
path = "src/main.rs"

[features]
# `/metrics/prometheus` on the health port (the image `…-prometheus`).
prometheus = []
# The quest bots (`roadmap/experiment-bots.md`): an experiment, off by default.
bot = ["dep:tunnel"]

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
# The quest bots' tunnel, shared with mh3sp-brain, from its GitHub mirror: pinned by commit, its version checked, both
# sides must agree (../docs/CLAUDE.md, "Our crates").
tunnel = { git = "https://github.com/mh3-rs/tunnel", rev = "2387ff5f7f8e6c4463823c73e5b395b3fbb3fcf9", version = "=0.1.0", optional = true }
bytes = "1.12.1"
dashmap = "6.2.1"
futures-util = "0.3.34"
hex = "0.4.3"
moka = { version = "0.12.16", features = ["sync"] }
openssl = "0.10.81"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "signal"] }
tokio-openssl = "0.6.5"
tokio-util = { version = "0.7.19", features = ["codec", "rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.27.0", features = ["v7"] }
wire = { path = "../wire" }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
# The API's messages, shared with the clients, from its GitHub mirror: pinned as the tunnel.
shared = { git = "https://github.com/mh3-rs/shared", rev = "b826efeeb6a0bde62d81093c5f1105ed392afa34", version = "=0.1.0" }

[dev-dependencies]
# Paused time in tests.
tokio = { version = "1.53.2", features = ["test-util"] }
tempfile = "3.27.0"
