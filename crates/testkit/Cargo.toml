[package]
name = "testkit"
description = "Test tooling: corpus of recorded game sessions, importer, scripted console, replay harness."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio-util = { version = "0.7.19", features = ["codec"] }
wire = { path = "../wire" }
