[package]
name = "testkit"
description = "Test tooling: corpus of recorded game sessions, importer, scripted console, replay harness."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
openssl = "0.10.81"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
tokio-openssl = "0.6.5"
tokio-util = { version = "0.7.19", features = ["codec"] }
toml = "1.1.7"
wire = { path = "../wire" }

[dev-dependencies]
server = { path = "../server" }
