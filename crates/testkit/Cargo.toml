[package]
name = "testkit"
description = "Test tooling: corpus of recorded game sessions, importer, scripted console, replay harness."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
hex = "0.4.3"
openssl = "0.10.81"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
tokio-openssl = "0.6.5"
tokio-util = { version = "0.7.19", features = ["codec"] }
toml = "1.1.7"
wire = { path = "../wire" }

[dev-dependencies]
tunnel = { workspace = true }
# The tests cover the quest bots too (the `bot` feature).
server = { path = "../server", features = ["bot"] }
tempfile = "3.27.0"
# To break a test's database under the running server.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
shared = { workspace = true }
