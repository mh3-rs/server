[package]
name = "wire"
description = "MH3 PAT packet layer: framing, packet ids, items. No game logic, no I/O."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bytes = "1.12.1"
thiserror = "2.0.21"
tokio-util = { version = "0.7.19", features = ["codec"] }

[dev-dependencies]
proptest = "1.11.0"
