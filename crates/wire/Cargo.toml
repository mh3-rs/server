[package]
name = "wire"
description = "MH3 PAT packet layer: framing, packet ids, items. No game logic, no I/O."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
openssl = "0.10.81"
percent-encoding = "2.3.2"
thiserror = "2.0.21"
tokio-util = { version = "0.7.19", features = ["codec"] }

[dev-dependencies]
hex = "0.4.3"
proptest = "1.11.0"
